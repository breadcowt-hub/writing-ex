<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글의 짜임 익히기 · 설명하는 글과 주장하는 글</title>
<style>
:root{
  --paper:#faf7f0;
  --ink:#2c2a26;
  --ink-soft:#6b665c;
  --ink-faint:#a39d90;
  --line:#e5e0d4;
  --line-strong:#cfc8b8;
  --card:#ffffff;
  --explain:#1d7a5f;
  --explain-bg:#e4f3ec;
  --explain-line:#a9dcc7;
  --argue:#c05a2e;
  --argue-bg:#fae9df;
  --argue-line:#eec3aa;
  --key:#b8860b;
  --key-bg:#fbf0d5;
  --key-line:#e8ce8a;
  --done:#1d7a5f;
  --done-bg:#e4f3ec;
  --done-line:#a9dcc7;
  --p0:#2f6fb0;   --p0-bg:#e6f0f9;   --p0-line:#b6d4ec;
  --p1:#b8860b;   --p1-bg:#fbf1d6;   --p1-line:#e8ce8a;
  --p2:#c0492e;   --p2-bg:#fae6e0;   --p2-line:#eebfb2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:820px;margin:0 auto;padding:32px 20px 64px}

header{text-align:center;margin-bottom:8px}
.eyebrow{font-size:14px;color:var(--ink-soft);letter-spacing:1px}
h1{font-size:28px;font-weight:800;margin:6px 0 4px;letter-spacing:-0.5px}
.rainbow{
  width:120px;height:5px;margin:8px auto 6px;border-radius:3px;
  background:linear-gradient(90deg,#c0492e,#e08a2e,#b8860b,#1d7a5f,#2f6fb0,#5b4b9e);
}
.sub{font-size:15px;color:var(--ink-soft)}

.tabs{display:flex;gap:8px;margin:24px 0 20px;background:#f0ebe0;padding:6px;border-radius:14px}
.tab{
  flex:1;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-soft);
  padding:12px 8px;border-radius:10px;transition:all .18s;
}
.tab .tsub{display:block;font-size:12px;font-weight:500;color:var(--ink-faint);margin-top:2px}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab.active.explain{color:var(--explain)}
.tab.active.explain .tsub{color:var(--explain)}
.tab.active.argue{color:var(--argue)}
.tab.active.argue .tsub{color:var(--argue)}

.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.how{
  font-size:14px;color:var(--ink-soft);background:#f0ebe0;
  border-radius:12px;padding:12px 16px;margin-bottom:18px;
}
.how b{color:var(--ink);font-weight:700}

/* 지붕: 집 모양 삼각형 */
.house{max-width:560px;margin:0 auto 16px}
.roof{
  position:relative;
  height:130px;margin:0 auto -1px;
  clip-path:polygon(50% 0, 100% 100%, 0 100%);
  background:var(--card);
  border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:12px;text-align:center;
  transition:all .3s;
  box-shadow:inset 0 0 0 1.5px var(--line-strong);
}
.roof::before{
  content:"";position:absolute;inset:0;
  clip-path:polygon(50% 0, 100% 100%, 0 100%);
  background:transparent;transition:background .4s;z-index:-1;
}
.roof.done{
  box-shadow:none;
  background:#c0261f;
}
.roof .rl{font-size:12px;color:var(--ink-faint);font-weight:800;max-width:60%}
.roof.done .rl{color:#fff;opacity:.95}
.roof .rt{font-size:14.5px;font-weight:900;margin-top:3px;color:var(--ink-soft);max-width:62%;line-height:1.35}
.roof.done .rt{color:#fff}

.walls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-bottom:16px;
  border:1.5px solid var(--line-strong);border-radius:0 0 4px 4px;overflow:hidden;background:var(--card)}
.wall{display:flex;flex-direction:column;gap:0;padding:8px;border-right:1.5px solid var(--line-strong)}
.wall:last-child{border-right:none}
.wall .brick{margin-top:7px}
.wall.built.p0{background:linear-gradient(180deg,transparent,var(--p0-bg))}
.wall.built.p1{background:linear-gradient(180deg,transparent,var(--p1-bg))}
.wall.built.p2{background:linear-gradient(180deg,transparent,var(--p2-bg))}
.wsum{
  border:1.5px solid var(--line-strong);border-radius:8px;
  padding:10px 8px;text-align:center;background:var(--card);
  transition:all .3s;min-height:74px;
  display:flex;flex-direction:column;justify-content:center;
}
.wsum.done{background:var(--key-bg);border-color:var(--key-line)}
.wsum .wl{font-size:17px;font-weight:900}
.wsum .wr{font-size:11px;color:var(--ink-faint);margin-top:1px}
.wsum .ws{font-size:12px;color:var(--ink-faint);margin-top:5px;line-height:1.4}
.wsum.done .ws{color:var(--ink);font-weight:600}
.wsum.done .wl{color:var(--key)}

/* 처음·중간·끝 부분별 색 */
.p0 .wl{color:var(--p0)}
.p1 .wl{color:var(--p1)}
.p2 .wl{color:var(--p2)}
.p0 .wsum{border-color:var(--p0-line)}
.p1 .wsum{border-color:var(--p1-line)}
.p2 .wsum{border-color:var(--p2-line)}
.p0 .wsum.done{background:var(--p0-bg);border-color:var(--p0-line)}
.p1 .wsum.done{background:var(--p1-bg);border-color:var(--p1-line)}
.p2 .wsum.done{background:var(--p2-bg);border-color:var(--p2-line)}
.p0 .wsum.done .wl{color:var(--p0)}
.p1 .wsum.done .wl{color:var(--p1)}
.p2 .wsum.done .wl{color:var(--p2)}
.p0 .brick.on{background:var(--p0-bg);border-color:var(--p0-line);color:var(--p0)}
.p1 .brick.on{background:var(--p1-bg);border-color:var(--p1-line);color:var(--p1)}
.p2 .brick.on{background:var(--p2-bg);border-color:var(--p2-line);color:var(--p2)}
.p0 .brick.on .plabel{color:var(--p0)}
.p1 .brick.on .plabel{color:var(--p1)}
.p2 .brick.on .plabel{color:var(--p2)}

.brick{
  border:1.5px solid var(--line);border-radius:10px;
  padding:10px 8px;font-size:13px;cursor:pointer;
  background:var(--card);transition:all .15s;text-align:center;
  line-height:1.4;
}
.brick:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.brick.on{background:var(--key-bg);border-color:var(--key-line);color:var(--key)}
.brick .plabel{
  display:inline-block;font-size:11px;font-weight:700;
  color:var(--ink-faint);background:#f0ebe0;
  border-radius:6px;padding:1px 7px;margin-bottom:5px;
}
.brick.on .plabel{color:var(--key);background:var(--card)}
.brick .ptext{display:block}
.brick .kw{font-weight:800}
.brick.on .kw{text-decoration:underline;text-underline-offset:2px}

.panel{
  border:1.5px solid var(--line);border-radius:14px;
  padding:14px 18px;min-height:72px;background:var(--card);margin-bottom:14px;
}
.panel .pt{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--key)}
.panel .pb{font-size:15px;line-height:1.6}
.panel .hint{color:var(--ink-faint)}

.bar{display:flex;align-items:center;gap:12px}
.prog{flex:1;font-size:14px;color:var(--ink-soft);font-weight:600}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong);transition:background .3s}
.dot.on{background:var(--done)}
.btn{
  border:1.5px solid var(--line-strong);border-radius:9px;
  background:var(--card);color:var(--ink);font-size:14px;
  padding:8px 16px;cursor:pointer;font-family:inherit;font-weight:600;
}
.btn:hover{border-color:var(--ink-soft)}

footer{text-align:center;margin-top:32px;font-size:13px;color:var(--ink-faint)}

@media(max-width:560px){
  h1{font-size:23px}
  .walls{gap:7px}
  .brick{font-size:12px;padding:8px 5px}
  .wsum .ws{font-size:11px}
  .tab{font-size:14px}
}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="eyebrow">국어 · 글의 짜임 익히기</div>
  <h1>문단이 모여 한 편의 글이 돼요</h1>
  <div class="rainbow"></div>
  <p class="sub">문단을 눌러 핵심어를 찾고, 처음·중간·끝을 요약해 전체 내용까지 완성해 보세요.</p>
</header>

<div class="tabs">
  <button class="tab explain active" data-view="explain">설명하는 글<span class="tsub">무지개가 생기는 까닭</span></button>
  <button class="tab argue" data-view="argue">주장하는 글<span class="tsub">일회용품을 줄이자</span></button>
</div>

<!-- ===== 설명하는 글 ===== -->
<section class="view active" id="view-explain"></section>

<!-- ===== 주장하는 글 ===== -->
<section class="view" id="view-argue"></section>

<footer>빵쌤 국어 · 처음·중간·끝으로 모여 한 편의 글이 됩니다</footer>
</div>

<script>
const DATA = {
  explain: {
    accent: "explain",
    roofLabel: "③ 글 전체 주제",
    roofLockText: "아직 잠김 — 처음·중간·끝을 모두 요약하면 열려요",
    roofDoneLabel: "③ 글 전체 주제 (완성!)",
    theme: "무지개는 물방울이 햇빛을 꺾어 일곱 빛깔로 나뉘며 생기는 자연 현상이다",
    unit: "주제",
    how: "설명하는 글은 <b>대상을 소개하고 → 원리를 설명하고 → 내용을 정리</b>합니다. 알려 주는 데서 끝나요.",
    walls: [
      { label:"처음", role:"설명할 대상 소개",
        summary:"비 갠 뒤 뜨는 무지개가 어떻게 생기는지 물음을 던짐",
        bricks:[
          {kw:"무지개", pre:"", post:"를 본 경험", sent:"비가 갠 뒤 하늘에 무지개가 뜨는 것을 본 적이 있을 것이다."},
          {kw:"어떻게 생길까", pre:"", post:" 물음", sent:"무지개는 어떻게 생기는 것일까?"}
        ]},
      { label:"중간", role:"원리를 나눠 설명",
        summary:"공기 중 물방울이 햇빛을 받아 일곱 빛깔로 나뉘는 원리를 설명함",
        bricks:[
          {kw:"물방울", pre:"", post:"이 햇빛 받음", sent:"공기 중의 물방울이 햇빛을 받아들인다."},
          {kw:"일곱 빛깔", pre:"", post:"로 나뉨", sent:"햇빛이 물방울 속에서 꺾이며 일곱 빛깔로 나뉜다."}
        ]},
      { label:"끝", role:"내용 정리",
        summary:"무지개는 물방울과 햇빛이 만든 자연 현상임을 정리함",
        bricks:[
          {kw:"물방울과 햇빛", pre:"", post:"의 만남", sent:"이처럼 무지개는 물방울과 햇빛이 만나 생긴다."},
          {kw:"자연 현상", pre:"", post:"임을 정리", sent:"무지개는 빛의 성질이 만들어 낸 자연 현상이다."}
        ]}
    ]
  },
  argue: {
    accent: "argue",
    roofLabel: "③ 글 전체 주장",
    roofLockText: "아직 잠김 — 처음·중간·끝을 모두 요약하면 열려요",
    roofDoneLabel: "③ 글 전체 주장 (완성!)",
    theme: "일회용품은 쓰레기와 자원 낭비를 부르니 다시 쓰는 물건을 써서 사용을 줄이자",
    unit: "주장",
    how: "주장하는 글은 <b>문제를 제기하고 → 근거를 들고 → 당부로 마무리</b>합니다. &lsquo;하자&rsquo;고 이끌어요.",
    walls: [
      { label:"처음", role:"문제 제기·주장",
        summary:"일회용품을 많이 쓰는 현실을 짚고 줄여야 한다고 주장함",
        bricks:[
          {kw:"일회용품", pre:"", post:"을 많이 씀", sent:"우리는 하루에도 수많은 일회용품을 쓰고 버린다."},
          {kw:"줄여야 한다", pre:"", post:" 주장", sent:"이제 일회용품 사용을 줄여야 한다."}
        ]},
      { label:"중간", role:"근거·이유",
        summary:"잘 썩지 않아 쓰레기가 쌓이고 자원이 낭비된다는 근거를 듦",
        bricks:[
          {kw:"쓰레기", pre:"", post:"가 쌓임 (근거①)", sent:"일회용품은 잘 썩지 않아 쓰레기가 쌓인다."},
          {kw:"자원 낭비", pre:"", post:" (근거②)", sent:"한 번 쓰고 버리니 자원이 낭비된다."}
        ]},
      { label:"끝", role:"주장 강조·당부",
        summary:"다시 쓰는 물건을 쓰자며 작은 것부터 실천할 것을 당부함",
        bricks:[
          {kw:"다시 쓰는 물건", pre:"", post:" 권함", sent:"일회용품 대신 다시 쓰는 물건을 쓰자."},
          {kw:"실천하자", pre:"", post:" 당부", sent:"작은 것부터 오늘 실천하자."}
        ]}
    ]
  }
};

function buildView(key){
  const d = DATA[key];
  const state = { clicked:[new Set(),new Set(),new Set()], done:new Set() };

  let wallsHtml = "";
  d.walls.forEach((w,wi)=>{
    let bricks = "";
    w.bricks.forEach((b,bi)=>{
      const pnum = wi*2 + bi + 1;
      bricks += `<div class="brick" data-w="${wi}" data-b="${bi}"><span class="plabel">문단 ${pnum}</span><span class="ptext">${b.pre}<span class="kw">${b.kw}</span>${b.post}</span></div>`;
    });
    wallsHtml += `
      <div class="wall p${wi}">
        <div class="wsum" data-wsum="${wi}">
          <div class="wl">${w.label}</div>
          <div class="wr">${w.role}</div>
          <div class="ws" data-ws="${wi}">중심 내용 ?</div>
        </div>
        ${bricks}
      </div>`;
  });

  const html = `
    <div class="how">${d.how}</div>
    <div class="house">
      <div class="roof" data-roof>
        <div class="rl" data-roofl>${d.roofLabel}</div>
        <div class="rt" data-rooft>${d.roofLockText}</div>
      </div>
      <div class="walls">${wallsHtml}</div>
    </div>
    <div class="panel">
      <div class="pt" data-pt>① 핵심어 찾기 → ② 문단 요약</div>
      <div class="pb hint" data-pb>문단을 누르면 반복되는 핵심어가 밑줄로 보여요. 한 부분(처음·중간·끝)의 문단을 모두 누르면 그 부분의 중심 내용이 채워집니다.</div>
    </div>
    <div class="bar">
      <div class="prog" data-prog>요약한 부분: 0 / 3</div>
      <div class="dots"><span class="dot" data-dot="0"></span><span class="dot" data-dot="1"></span><span class="dot" data-dot="2"></span></div>
      <button class="btn" data-reset>다시</button>
    </div>`;

  const root = document.getElementById("view-"+key);
  root.innerHTML = html;

  const roof = root.querySelector("[data-roof]");
  const roofl = root.querySelector("[data-roofl]");
  const rooft = root.querySelector("[data-rooft]");
  const pt = root.querySelector("[data-pt]");
  const pb = root.querySelector("[data-pb]");
  const prog = root.querySelector("[data-prog]");

  function refresh(){
    prog.textContent = "요약한 부분: "+state.done.size+" / 3";
    root.querySelectorAll("[data-dot]").forEach((el,i)=>{
      el.classList.toggle("on", state.done.has(i));
    });
    root.querySelectorAll(".wall").forEach((el,i)=>{
      el.classList.toggle("built", state.done.has(i));
    });
    if(state.done.size===3){
      roof.classList.add("done");
      roofl.textContent = d.roofDoneLabel;
      rooft.textContent = d.theme;
      pt.textContent = "③ 전체 "+d.unit+" 정리";
      pb.textContent = "처음·중간·끝 요약을 이으면 글 한 편의 "+d.unit+"이 됩니다.";
      pb.classList.remove("hint");
    } else {
      roof.classList.remove("done");
      roofl.textContent = d.roofLabel;
      rooft.textContent = d.roofLockText;
    }
  }

  root.querySelectorAll(".brick").forEach(brick=>{
    brick.addEventListener("click",()=>{
      const wi = +brick.dataset.w, bi = +brick.dataset.b;
      const info = d.walls[wi].bricks[bi];

      if(state.clicked[wi].has(bi)){
        // 다시 누르면 선택 해제
        brick.classList.remove("on");
        state.clicked[wi].delete(bi);
        if(state.done.has(wi)){
          state.done.delete(wi);
          root.querySelector(`[data-ws="${wi}"]`).textContent = "중심 내용 ?";
          root.querySelector(`[data-wsum="${wi}"]`).classList.remove("done");
        }
        pt.textContent = "① 핵심어 찾기 → ② 문단 요약";
        pb.textContent = "선택을 해제했어요. 다른 문단을 눌러 보세요.";
      } else {
        // 새로 선택
        brick.classList.add("on");
        state.clicked[wi].add(bi);
        pt.textContent = "① 핵심어: "+info.kw;
        pb.textContent = info.sent;
        pb.classList.remove("hint");
        if(state.clicked[wi].size===2 && !state.done.has(wi)){
          state.done.add(wi);
          root.querySelector(`[data-ws="${wi}"]`).textContent = d.walls[wi].summary;
          root.querySelector(`[data-wsum="${wi}"]`).classList.add("done");
        }
      }
      refresh();
    });
  });

  root.querySelector("[data-reset]").addEventListener("click",()=>{
    state.clicked = [new Set(),new Set(),new Set()];
    state.done = new Set();
    root.querySelectorAll(".brick").forEach(b=>b.classList.remove("on"));
    d.walls.forEach((w,wi)=>{
      root.querySelector(`[data-ws="${wi}"]`).textContent = "중심 내용 ?";
      root.querySelector(`[data-wsum="${wi}"]`).classList.remove("done");
    });
    roof.classList.remove("done");
    roofl.textContent = d.roofLabel;
    rooft.textContent = d.roofLockText;
    pt.textContent = "① 핵심어 찾기 → ② 문단 요약";
    pb.textContent = "문단을 누르면 반복되는 핵심어가 밑줄로 보여요. 한 부분(처음·중간·끝)의 문단을 모두 누르면 그 부분의 중심 내용이 채워집니다.";
    pb.classList.add("hint");
    refresh();
  });

  refresh();
}

buildView("explain");
buildView("argue");

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    const v = tab.dataset.view;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".view").forEach(view=>view.classList.remove("active"));
    document.getElementById("view-"+v).classList.add("active");
  });
});
</script>
</body>
</html>
